    <!-- Ears & Silver Pearl Studs -->
    <circle cx="42" cy="55" r="3" fill="#e8b288"/>
    <circle cx="78" cy="55" r="3" fill="#e8b288"/>
    <circle cx="42" cy="56.5" r="1.3" fill="#e2e8f0"/>
    <circle cx="78" cy="56.5" r="1.3" fill="#e2e8f0"/>

