<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Fictional portrait of Dr. Sneha Desai">
  <defs>
    <clipPath id="circleClip4">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25242b"/>
      <stop offset="100%" stop-color="#17151c"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="#2a2e39" stroke="#3d4454" stroke-width="2"/>
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad4)"/>

  <g clip-path="url(#circleClip4)">
