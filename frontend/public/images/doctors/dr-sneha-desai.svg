    <path d="M38 48 C38 32 46 25 60 25 C74 25 82 32 82 48 C79 36 71 31 60 31 C49 31 41 36 38 48 Z" fill="#2b2622"/>
    <path d="M41 42 C46 32 54 29 64 31 C72 32 78 38 80 44 C76 36 68 33 60 33 C52 33 45 36 41 42 Z" fill="#1e1b18"/>

    <!-- Eyes (Refined, expressive) -->
    <circle cx="52.5" cy="52" r="2.1" fill="#1e1b18"/>
    <circle cx="67.5" cy="52" r="2.1" fill="#1e1b18"/>
    <circle cx="53.2" cy="51.2" r="0.7" fill="#ffffff"/>
    <circle cx="68.2" cy="51.2" r="0.7" fill="#ffffff"/>

    <!-- Eyebrows (Arched, elegant) -->
    <path d="M47 46 C50 43 55 44 57 47" fill="none" stroke="#2b2622" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M63 47 C65 44 70 43 73 46" fill="none" stroke="#2b2622" stroke-width="1.3" stroke-linecap="round"/>

