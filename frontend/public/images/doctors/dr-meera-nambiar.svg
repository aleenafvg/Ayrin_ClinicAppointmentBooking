<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Fictional portrait of Dr. Meera Nambiar">
  <defs>
    <clipPath id="circleClip2">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24282e"/>
      <stop offset="100%" stop-color="#16181e"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="#2a2e39" stroke="#3d4454" stroke-width="2"/>
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad2)"/>

  <g clip-path="url(#circleClip2)">
    <!-- Back Hair Flow -->
    <path d="M34 50 C30 75 36 95 44 110 L76 110 C84 95 90 75 86 50 Z" fill="#1c1917"/>

    <!-- Shoulders & Torso -->
    <path d="M22 120 C24 98 38 90 60 90 C82 90 96 98 98 120 Z" fill="#1e293b"/>
    <!-- Medical Scrub Top (Teal-Sage for Pediatrics) -->
    <polygon points="46 96, 60 114, 74 96, 68 90, 52 90" fill="#2d4a43"/>
    <!-- White Doctor Coat -->
    <path d="M24 120 C26 102 38 92 48 94 L53 120 Z" fill="#f1f5f9"/>
    <path d="M96 120 C94 102 82 92 72 94 L67 120 Z" fill="#f1f5f9"/>

    <!-- Neck -->
    <rect x="53" y="70" width="14" height="20" rx="3" fill="#e0a96d"/>

    <!-- Pediatric Stethoscope (Warm Slate Accent) -->
    <path d="M44 98 C44 112 51 117 60 117 C69 117 76 112 76 98" fill="none" stroke="#6e8c76" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="117" r="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Head & Face -->
    <ellipse cx="60" cy="54" rx="18" ry="22" fill="#ebba85"/>

    <!-- Ears & Stud Earrings -->
    <circle cx="41.5" cy="56" r="3.5" fill="#e0a96d"/>
    <circle cx="78.5" cy="56" r="3.5" fill="#e0a96d"/>
    <circle cx="41.5" cy="58" r="1.5" fill="#fbbf24"/>
    <circle cx="78.5" cy="58" r="1.5" fill="#fbbf24"/>

    <!-- Hair (Front framing) -->
    <path d="M38 52 C37 34 44 26 60 26 C76 26 83 34 82 52 C79 38 72 32 60 32 C48 32 41 38 38 52 Z" fill="#292524"/>
    <path d="M38 42 C44 32 54 30 60 33 C66 30 76 32 82 42 C78 35 68 33 60 35 C52 33 42 35 38 42 Z" fill="#1c1917"/>
    <path d="M39 48 C37 60 41 72 43 78 C41 72 39 62 41 48 Z" fill="#292524"/>
    <path d="M81 48 C83 60 79 72 77 78 C79 72 81 62 79 48 Z" fill="#292524"/>

    <!-- Eyes -->
    <circle cx="52" cy="53" r="2.2" fill="#1c1917"/>
    <circle cx="68" cy="53" r="2.2" fill="#1c1917"/>
    <circle cx="53" cy="52" r="0.7" fill="#ffffff"/>
    <circle cx="69" cy="52" r="0.7" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M47 47 C50 45 55 46 57 48" fill="none" stroke="#292524" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M63 48 C65 46 70 45 73 47" fill="none" stroke="#292524" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M59 55 L58 62 L62 62" fill="none" stroke="#c98c55" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warm Pediatrician Smile -->
    <path d="M53 68 C56 72 64 72 67 68" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>

